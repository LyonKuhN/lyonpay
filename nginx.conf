# Front do Lyonk servido pelo nginx.
# /api é encaminhado para o serviço da API na mesma rede do docker-compose: o site e a API ficam
# no mesmo endereço, e o cookie de sessão (httpOnly) é de primeira parte em qualquer navegador.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 10m;

  location /api/ {
    # Resolve o nome do serviço na hora (o nginx sobe mesmo se a API ainda não estiver no ar)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://lyonpay-api:3005;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;
  }

  # Service worker e manifesto sempre atualizados
  location = /sw.js {
    include /etc/nginx/snippets/seguranca.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.json {
    include /etc/nginx/snippets/seguranca.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Arquivos com hash no nome podem ficar em cache por 1 ano
  location /assets/ {
    include /etc/nginx/snippets/seguranca.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/seguranca.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
